[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cargo-optimizer3d"
version = "0.1.0"
description = "Software profesional de optimización de carga 3D para espacios de carga universales (Loading Spaces)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "CargoOptimizer3D" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Private :: Do Not Upload",
]
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
cargo-optimizer3d = "cargo_optimizer.__main__:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "black>=24.8", "mypy>=1.11", "pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/cargo_optimizer"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
# El formateo de código lo hace Black, no el formateador de Ruff.

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
